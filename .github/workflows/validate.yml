name: Validate YAML

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/validate_membership.py --index sp500
      - run: python scripts/validate_yaml.py
      - run: python scripts/audit_membership.py
