name: Refresh Official PIT Membership

on:
  schedule:
    # Every weekday. Weekly was long enough for a change to come and go
    # unnoticed; the live check below is cheap and is the run that matters.
    - cron: "41 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Year-file housekeeping (rollover, elapsed pending flags)
        run: python scripts/rollover_year.py --index sp500
      - name: Fetch official S&P announcements
        run: python scripts/fetch_official_sp500_announcements.py
      - name: Plan update
        run: python scripts/update_membership_yaml.py --index sp500 --dry-run
      - name: Apply validated candidates
        run: python scripts/update_membership_yaml.py --index sp500 --apply
      - name: Validate and audit
        run: |
          python scripts/validate_membership.py --index sp500
          python scripts/audit_membership_update.py
      # Runs even if the crawler or validation failed: it shares no code with
      # the crawler, so it is most valuable exactly when the crawler is broken.
      #
      # continue-on-error so a GitHub API failure while raising an issue cannot
      # hold back the membership PR below; a later step turns the run red if
      # either alert step failed.
      - name: Live constituent check (official current list vs YAML)
        id: live_alert
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_live_constituents.py --index sp500 --alert
      - name: Manual-review alert
        id: review_alert
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/alert_manual_review.py --index sp500 --alert
      - name: Freshness and YAML checks
        run: |
          # --no-fail here on purpose: this is the step that WRITES the freshness
          # report, and it runs before the review PR is opened. Letting it exit
          # non-zero would abort the job and skip the PR entirely, so a stale
          # dataset would also stop being refreshed -- the opposite of the point.
          # Enforcement is the final step in this job, after the data lands.
          python scripts/check_freshness.py --index sp500 --no-fail
          python scripts/validate_yaml.py
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp500-membership-refresh-audit
          path: |
            audit/
            metadata/*fetch_state.json
            metadata/data_freshness.json
            metadata/live_check_state.json
      - name: Commit refreshed metadata and audit
        # The membership YAML being unchanged does NOT mean nothing was refreshed.
        # check_freshness.py and the audit reports rewrite themselves on every run,
        # and the old workflow exited before `git add` whenever the YAML was static,
        # so those refreshes were discarded and the repo reported itself stale even
        # while the automation was healthy. Metadata and audit are derived artifacts
        # with no review value, so they go straight to main.
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git status --porcelain`, not `git diff --quiet`: diff ignores
          # untracked files, so a newly created year file was invisible here.
          if [ -n "$(git status --porcelain -- src/sp500_ticker_history)" ]; then
            echo "Membership YAML changed -- metadata travels with the review PR."
            exit 0
          fi
          git add metadata audit
          if git diff --cached --quiet; then
            echo "Metadata and audit reports unchanged."
            exit 0
          fi
          git commit -m "chore(data): refresh S&P 500 freshness metadata and audit ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main

      - name: Open review pull request
        id: review_pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/sp500_ticker_history)" ]; then
            echo "No membership YAML changes detected."
            exit 0
          fi
          stamp="$(date -u +%Y-%m-%d)"
          branch="automation/refresh-sp500-${stamp}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/sp500_ticker_history metadata audit
          git commit -m "data: refresh S&P 500 PIT membership through ${stamp}"
          git push --set-upstream origin "$branch"
          url="$(gh pr create             --base main             --head "$branch"             --title "Update PIT membership through ${stamp}"             --body-file audit/update_diff_report.md)"
          echo "Opened $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # After the PR step, so the state file and the alert are already written.
      # Red here means the YAML disagrees with SPY's current holdings (or the
      # holdings file has been unreachable for 3+ days) -- the open live-check
      # issue says which names.
      - name: Gate on the live constituent check
        if: ${{ !cancelled() }}
        run: python scripts/check_live_constituents.py --index sp500 --gate

      - name: Fail if an alert could not be raised
        if: ${{ !cancelled() && (steps.live_alert.outcome == 'failure' || steps.review_alert.outcome == 'failure') }}
        run: |
          echo "::error::An alert step failed (see its log); the condition it was reporting may be unannounced."
          exit 1

      - name: Fail the run if the dataset is stale or incomplete
        # Deliberately last, and if: always(). The refresh has to land first -- a
        # consumer pinning this repo is better off with fresh-but-flagged data and
        # a red run than with a green run and a roster that quietly stopped moving.
        # That silence is exactly what a downstream backtest cannot detect for
        # itself: "no membership changes" and "no longer recording changes" look
        # identical from the outside.
        if: always()
        shell: bash
        run: |
          f=metadata/data_freshness.json
          if [ ! -f "$f" ]; then
            echo "::error::$f was not produced -- freshness is unknown, which is not the same as fine."
            exit 1
          fi
          level="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["confidence_level"])' "$f")"
          echo "confidence_level=$level"
          if [ "$level" != "high" ]; then
            python -c 'import json,sys;[print("::error::stale_or_incomplete: "+w) for w in json.load(open(sys.argv[1]))["warnings"]]' "$f"
            exit 1
          fi
          echo "Dataset is current."

      - name: Auto-merge the validated membership PR
        if: ${{ steps.review_pr.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.review_pr.outputs.url }}
        shell: bash
        run: |
          # The refresh job already ran the full validators on these exact bytes.
          # This step is deliberately after the live-list, alert-delivery and
          # freshness gates. Any earlier failure leaves the PR open and main
          # unchanged instead of publishing an untrusted roster.
          outstanding="$(python scripts/alert_manual_review.py --index sp500 --count)"
          if [ "$outstanding" -gt 0 ]; then
            echo "::warning::${outstanding} outstanding manual-review item(s) -- PR left open for review."
            gh pr edit "$PR_URL" --add-label "needs-human-review" || true
            exit 0
          fi
          gh pr merge "$PR_URL" --merge --delete-branch
          echo "Merged $PR_URL after every gate passed."
